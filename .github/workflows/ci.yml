name: Code Quality Check

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  linting:
    name: Formatting and Static Analysis
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-15 clang-tidy-15

    - name: Check Code Style (clang-format)
      run: |
        find . -regex '.*\.\(cpp\|hpp\|h\)' -not -path './build/*' -not -path './third_party/*' -print0 | xargs -0 clang-format-15 --dry-run --Werror

    - name: Run Static Analysis (clang-tidy)
      run: |
        files=$(find . -regex '.*\.\(cpp\|hpp\|h\)' -not -path './build/*' -not -path './third_party/*')
        
        # -p build/ - если есть файл compile_commands.json (рекомендуется)
        clang-tidy-15 $files -- -std=c++17